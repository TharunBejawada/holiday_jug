version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../../
            - npm ci
            - npm run db:generate
        build:
          commands:
            # Amplify's shell session persists across phases — preBuild's
            # `cd ../../` carries into this phase too, so every command
            # here is explicit about its directory rather than assuming
            # cwd == appRoot (that assumption caused a "No such file or
            # directory" writing .next/.env.production, since the shell
            # was actually still sitting at the repo root at this point).
            - cd apps/web && npm run build
            # Amplify injects console-configured env vars into the build
            # shell, but the deployed SSR Lambda's runtime doesn't
            # automatically inherit them. AWS's documented workaround is to
            # write a .env.production file INSIDE the artifact directory
            # (artifacts.baseDirectory below is .next, so this file must
            # live under .next/, not the project root) so Next.js picks it
            # up at request time. Must run AFTER `next build` — .next/
            # doesn't exist yet before that.
            - cd apps/web && echo "DATABASE_URL=$DATABASE_URL" > .next/.env.production
            - cd apps/web && echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" >> .next/.env.production
            - cd apps/web && echo "NEXTAUTH_URL=$NEXTAUTH_URL" >> .next/.env.production
            - cd apps/web && echo "API_INTERNAL_SECRET=$API_INTERNAL_SECRET" >> .next/.env.production
            - cd apps/web && echo "SES_REGION=$SES_REGION" >> .next/.env.production
            - cd apps/web && echo "SES_FROM_EMAIL=$SES_FROM_EMAIL" >> .next/.env.production
            - cd apps/web && echo "S3_REGION=$S3_REGION" >> .next/.env.production
            - cd apps/web && echo "S3_BUCKET_NAME=$S3_BUCKET_NAME" >> .next/.env.production
            - cd apps/web && echo "S3_PUBLIC_BASE_URL=$S3_PUBLIC_BASE_URL" >> .next/.env.production
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
