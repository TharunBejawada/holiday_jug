version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../../
            - npm ci
            - npm run db:generate
        build:
          commands:
            # Amplify runs every command across every phase in ONE
            # continuous shell session (confirmed the hard way) — preBuild's
            # `cd ../../` is still in effect here, so `cd apps/web` (once)
            # is what actually gets us into the right place. Do NOT repeat
            # `cd apps/web` on later lines: by then we're already there,
            # and there's no nested apps/web inside apps/web to cd into.
            - cd apps/web
            - npm run build
            # Amplify injects console-configured env vars into the build
            # shell, but the deployed SSR Lambda's runtime doesn't
            # automatically inherit them. AWS's documented workaround is to
            # write a .env.production file INSIDE the artifact directory
            # (artifacts.baseDirectory below is .next, so this file must
            # live under .next/, not the project root) so Next.js picks it
            # up at request time. Must run AFTER `next build` — .next/
            # doesn't exist yet before that.
            - echo "DATABASE_URL=$DATABASE_URL" > .next/.env.production
            - echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" >> .next/.env.production
            - echo "NEXTAUTH_URL=$NEXTAUTH_URL" >> .next/.env.production
            - echo "API_INTERNAL_SECRET=$API_INTERNAL_SECRET" >> .next/.env.production
            - echo "SES_REGION=$SES_REGION" >> .next/.env.production
            - echo "SES_FROM_EMAIL=$SES_FROM_EMAIL" >> .next/.env.production
            - echo "S3_REGION=$S3_REGION" >> .next/.env.production
            - echo "S3_BUCKET_NAME=$S3_BUCKET_NAME" >> .next/.env.production
            - echo "S3_PUBLIC_BASE_URL=$S3_PUBLIC_BASE_URL" >> .next/.env.production
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
